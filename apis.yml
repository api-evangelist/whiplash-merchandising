- aid: whiplash-merchandising:whiplash-merchandising-items-api
  name: Whiplash Merchandising items API
  description: >-
    Items are probably the most fundamental entity in the Whiplash system. An item is simply a 'shippable
    unit'. So, it's not a Whiplash T-Shirt; it's a Small Whiplash T-Shirt, for instance.

    Most commerce platforms model Products. Typically, however, a Product (e.g. a T-Shirt) has variations
    (named variously, Variants, ProductOptions, OptionSets, etc). An Item maps to the Variant/Option,
    not the Product.
  humanURL: https://developers.getwhiplash.com
  baseURL: https://www.getwhiplash.com/api/v2
