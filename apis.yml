aid: whiplash-merchandising
name: Whiplash Merchandising
description: >-
  Whiplash (now Ryder E-commerce by Whiplash) is an order-fulfillment and
  third-party logistics (3PL) platform for direct-to-consumer and ecommerce
  brands. It runs a network of fulfillment centers offering pick-pack-ship,
  warehousing, inventory management, kitting, omnichannel order routing, and
  returns processing. The company exposes the Rydership V2 REST API (formerly
  the Whiplash API) so merchants and platforms can programmatically manage
  items, orders, order items, shipments (ship notices), consumer returns,
  customers, documents, and webhook notification subscriptions across the
  fulfillment lifecycle. Whiplash was founded in 2011, backed by 500 Global,
  and acquired by Ryder System in 2021.
